<div id="app">
  <div id="screen"><canvas id="cv" aria-label="Spilskærm"></canvas><div id="dlg" hidden></div><div id="place" hidden></div><p class="hint-k">Piletaster · Z = A · X = B · Enter = MENU · Shift = RÆV</p></div>

      <button class="pill" data-k="start" type="button" aria-label="Menu">MENU</button>
      <button class="pill" data-k="select" type="button" aria-label="Tal med ræven">RÆV</button>
    </div>
    <div class="ab"><button data-k="a" type="button" aria-label="A">A</button><button data-k="b" type="button" aria-label="B">B</button></div>
  </div>
