<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1c232">
<meta name="description" content="Sprogånder: Gul udgave. Et retro-RPG hvor du lærer dansk ved at fange sprogånder i København.">
<title>Sprogånder Gul</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23f1c232'/%3E%3Cpath d='M3 4l2-3 2 3h2l2-3 2 3v6l-5 4-5-4z' fill='%23e8843a'/%3E%3Cpath d='M6 9h4l-2 3z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="dev">
  <div id="bezel">
    <div class="bz-top"><i></i><span></span>SPROGÅNDER · FARVE</div>
    <div id="screen"><canvas id="cv" aria-label="Spilskærm"></canvas><div id="dlg" hidden></div><div id="place" hidden></div></div>
  </div>
  <div class="brand"><span>SPROG<b>ÅNDER</b></span><em>GUL</em></div>
  <div id="pad">
    <div id="dpad" role="group" aria-label="Retningsknapper"><i class="hub"></i><i class="ar u"></i><i class="ar d"></i><i class="ar l"></i><i class="ar r"></i></div>
    <div class="mid">
      <button class="pill" data-k="select" type="button" aria-label="Select: tal med ræven"><i></i><small>SELECT</small></button>
      <button class="pill" data-k="start" type="button" aria-label="Start: menu"><i></i><small>START</small></button>
    </div>
    <div class="ab"><button data-k="b" type="button" aria-label="B"><span>B</span></button><button data-k="a" type="button" aria-label="A"><span>A</span></button></div>
  </div>
  <p class="hint-k">Piletaster gå · Z = A · X = B · Enter = START · Shift = SELECT</p>
</div>
<div id="sheet" hidden><div id="sheetIn" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<script src="src/content.js"></script>
<script src="src/gfx-base.js"></script>
<script src="src/gfx-map.js"></script>
<script src="src/gfx-people.js"></script>
<script src="src/gfx-creatures.js"></script>
<script src="src/maps.js"></script>
<script src="src/core.js"></script>
<script src="src/audio.js"></script>
<script src="src/ui.js"></script>
<script src="src/world.js"></script>
<script src="src/battle.js"></script>
<script src="src/menus.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
